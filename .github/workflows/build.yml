name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed|^> |FAILED|not found|Could not" build.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Gradle::${msg}"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: FaceSwap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
