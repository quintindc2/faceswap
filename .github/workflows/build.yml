name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -vE "^> Task .*(UP-TO-DATE|NO-SOURCE)?$" build.log | grep -E "^e: |^w: .*kt|error:|What went wrong|Execution failed|FAILED|not found|Could not|^> [A-Z]" | grep -v '^> Task' | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Gradle::${msg}"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: FaceSwap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "FaceSwap debug APK" \
            --notes "Debug build of the FaceSwap Android app (installable APK)."
